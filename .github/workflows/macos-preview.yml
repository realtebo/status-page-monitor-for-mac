name: macOS preview release

on:
  push:
    tags:
      - 'v[0-9]*'

concurrency:
  group: macos-preview-${{ github.ref }}
  queue: max

jobs:
  release:
    if: github.repository == 'realtebo/status-page-monitor-for-mac' && github.event.created && !github.event.deleted
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      APP_ARCHIVE: StatusPageMonitor-macOS-arm64.zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read the version and changelog from the annotated tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Expected a version tag such as v0.03 or v0.02.1."
            exit 1
          fi
          if [[ "$(git cat-file -t "$GITHUB_REF")" != tag ]]; then
            echo "::error::An annotated tag with release notes is required."
            exit 1
          fi
          if [[ "$(git rev-parse "$GITHUB_REF^{commit}")" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::The tag and checkout must refer to the same commit."
            exit 1
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          git for-each-ref --format='%(contents)' "$GITHUB_REF" \
            | sed -E '/^-----BEGIN (PGP SIGNATURE|SSH SIGNATURE|SIGNED MESSAGE)-----$/,$d' > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::The tag message must describe the changes in this release."
            exit 1
          fi
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Compile and package
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project StatusPageMonitor.xcodeproj \
            -scheme StatusPageMonitor -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            -onlyUsePackageVersionsFromResolvedFile \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$RELEASE_VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build

          app="build/Build/Products/Release/StatusPageMonitor.app"
          actual_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          if [[ "$actual_version" != "$RELEASE_VERSION" ]]; then
            echo "::error::The app version does not match the release tag."
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app" "$APP_ARCHIVE"

      - name: Publish preview to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          if release="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets)"; then
            if jq -e '.isDraft' <<< "$release" > /dev/null; then
              gh release upload "$tag" "$APP_ARCHIVE" --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --notes-file "$RUNNER_TEMP/release-notes.md"
            else
              jq -e --arg name "$APP_ARCHIVE" 'any(.assets[]; .name == $name and .size > 0)' <<< "$release" > /dev/null
            fi
          else
            gh release create "$tag" "$APP_ARCHIVE" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
              --title "Status Page Monitor $RELEASE_VERSION preview" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
